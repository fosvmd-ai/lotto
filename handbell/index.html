<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유튜브 AI 핸드벨 합주실</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      overflow: hidden;
      background-color: #0f172a;
    }
    .font-jua { font-family: 'Jua', cursive; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col text-white">

  <!-- 상단 컨트롤 바 -->
  <header class="h-20 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <span class="text-3xl">🔔</span>
      <div>
        <h1 id="songTitle" class="text-xl font-bold font-jua text-amber-400">유튜브 AI 핸드벨 합주실</h1>
        <p class="text-xs text-slate-400">내려오는 종 색깔에 맞춰 실물 핸드벨을 흔드세요!</p>
      </div>
    </div>

    <!-- 유튜브 입력 및 옵션 컨트롤 -->
    <div class="flex items-center gap-2">
      <input 
        id="ytUrlInput" 
        type="text" 
        placeholder="유튜브 링크 입력 (https://youtu.be/...)" 
        class="w-64 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400"
      />
      
      <select id="diffSelect" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-white focus:outline-none">
        <option value="easy">초급 (단선율)</option>
        <option value="normal" selected>중급 (표준)</option>
        <option value="hard">고급 (화음/빠름)</option>
      </select>

      <button id="analyzeBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-md transition flex items-center gap-1">
        <span>⚡</span> 악보 생성
      </button>

      <div class="h-6 w-px bg-slate-700 mx-1"></div>

      <button id="guideAudioToggle" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-semibold transition">
        가이드 벨소리: <span id="guideAudioText" class="text-amber-400 font-bold">ON</span>
      </button>

      <button id="playBtn" disabled class="bg-amber-500 disabled:opacity-40 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm shadow-lg transition flex items-center gap-2">
        <span id="playIcon">▶</span> <span id="playText">연주 시작</span>
      </button>
      
      <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs transition">
        처음으로
      </button>
    </div>
  </header>

  <!-- 메인 캔버스 -->
  <main class="relative flex-1 bg-slate-950 flex items-center justify-center">
    <canvas id="gameCanvas" class="w-full h-full block"></canvas>

    <!-- 분석 로딩 모달 -->
    <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 backdrop-blur-md hidden z-40">
      <div class="w-14 h-14 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-jua text-2xl text-amber-400">유튜브 음원에서 8음계 멜로디를 분석 중입니다...</p>
      <p class="text-xs text-slate-400 mt-2">약 10~20초 소요됩니다.</p>
    </div>

    <!-- 예비박 카운트다운 -->
    <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm pointer-events-none hidden z-30">
      <div id="countdownText" class="font-jua text-9xl text-amber-400 drop-shadow-[0_10px_30px_rgba(251,191,36,0.6)] animate-pulse">
        준비!
      </div>
    </div>
  </main>

  <script>
    const BACKEND_URL = "http://localhost:8000";

    const LANES = [
      { pitch: 'C4', name: '도', color: '#FF3B30', lightColor: '#FF6961', freq: 261.63 },
      { pitch: 'D4', name: '레', color: '#FF9500', lightColor: '#FFB340', freq: 293.66 },
      { pitch: 'E4', name: '미', color: '#FFCC00', lightColor: '#FFE066', freq: 329.63 },
      { pitch: 'F4', name: '파', color: '#34C759', lightColor: '#6BD885', freq: 349.23 },
      { pitch: 'G4', name: '솔', color: '#5AC8FA', lightColor: '#8EE0FC', freq: 392.00 },
      { pitch: 'A4', name: '라', color: '#007AFF', lightColor: '#4DA2FF', freq: 440.00 },
      { pitch: 'B4', name: '시', color: '#AF52DE', lightColor: '#C87DF2', freq: 493.88 },
      { pitch: 'C5', name: '높은도', color: '#FFFFFF', lightColor: '#E2E8F0', freq: 523.25 }
    ];

    // 가이드 벨 신디사이저
    class HandbellAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playBell(freq, duration = 1.2) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [1, 2.76, 5.4].forEach((h, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * h, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime([0.5, 0.2, 0.08][i], now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (duration * (1 / (i + 1))));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bellSynth = new HandbellAudio();
    const bgmAudio = new Audio();

    let isPlaying = false;
    let songTime = 0;
    let lastTimestamp = 0;
    let hitLineY = 0;
    let laneWidth = 0;
    let activeRipples = [];
    let playedNotes = new Set();
    let currentChart = [];
    const SPEED_PIXELS_PER_SEC = 280;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      laneWidth = canvas.width / 8;
      hitLineY = canvas.height - 120;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 렌더링 루프
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 레인 배경
      for (let i = 0; i < 8; i++) {
        const x = i * laneWidth;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(30, 41, 59, 0.4)' : 'rgba(15, 23, 42, 0.4)';
        ctx.fillRect(x, 0, laneWidth, canvas.height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // 판정 타격선
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, hitLineY);
      ctx.lineTo(canvas.width, hitLineY);
      ctx.stroke();

      // 하강하는 벨 노트
      currentChart.forEach((note, idx) => {
        const timeDiff = note.time - songTime;
        const noteY = hitLineY - (timeDiff * SPEED_PIXELS_PER_SEC);
        const lane = LANES[note.lane];
        const noteX = note.lane * laneWidth + laneWidth / 2;

        if (noteY > -100 && noteY < canvas.height + 100) {
          // 롱노트 바
          if (note.dur > 0.8) {
            const tailH = note.dur * SPEED_PIXELS_PER_SEC;
            ctx.fillStyle = `${lane.color}44`;
            ctx.strokeStyle = lane.color;
            ctx.lineWidth = 2;
            ctx.fillRect(noteX - 16, noteY - tailH, 32, tailH);
            ctx.strokeRect(noteX - 16, noteY - tailH, 32, tailH);
          }

          // 도달 예고 서클
          if (timeDiff > 0 && timeDiff < 0.5) {
            const r = 35 + (timeDiff / 0.5) * 40;
            ctx.strokeStyle = lane.lightColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(noteX, hitLineY, r, 0, Math.PI * 2);
            ctx.stroke();
          }

          // 핸드벨 헤드
          ctx.save();
          ctx.translate(noteX, noteY);
          ctx.shadowColor = lane.color;
          ctx.shadowBlur = 15;
          ctx.fillStyle = lane.color;
          ctx.beginPath();
          ctx.arc(0, 0, 32, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#FFFFFF';
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = note.lane === 7 ? '#0F172A' : '#FFFFFF';
          ctx.font = 'bold 20px Jua';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(lane.name, 0, 2);
          ctx.restore();
        }

        // 타격 타이밍 도달
        if (isPlaying && timeDiff <= 0 && !playedNotes.has(idx)) {
          playedNotes.add(idx);
          bellSynth.playBell(lane.freq, note.dur);
          activeRipples.push({
            x: noteX,
            y: hitLineY,
            color: lane.color,
            radius: 35,
            alpha: 1.0
          });
        }
      });

      // 리플 애니메이션
      activeRipples.forEach((rip, idx) => {
        ctx.save();
        ctx.strokeStyle = rip.color;
        ctx.lineWidth = 5;
        ctx.globalAlpha = rip.alpha;
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        rip.radius += 2.5;
        rip.alpha -= 0.04;
        if (rip.alpha <= 0) activeRipples.splice(idx, 1);
      });

      // 하단 고정 벨 자리
      for (let i = 0; i < 8; i++) {
        const lane = LANES[i];
        const x = i * laneWidth + laneWidth / 2;
        ctx.save();
        ctx.translate(x, hitLineY);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.arc(0, 0, 36, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = lane.color;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = lane.lightColor;
        ctx.font = 'bold 16px Jua';
        ctx.textAlign = 'center';
        ctx.fillText(lane.name, 0, 56);
        ctx.restore();
      }
    }

    // 메인 루프 (BGM 오디오 시간과 싱크)
    function update(timestamp) {
      if (isPlaying) {
        if (bgmAudio.src && !bgmAudio.paused) {
          songTime = bgmAudio.currentTime;
        } else {
          if (!lastTimestamp) lastTimestamp = timestamp;
          songTime += (timestamp - lastTimestamp) / 1000;
        }
      }
      lastTimestamp = timestamp;
      draw();
      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);

    // 이벤트 리스너 & API 통신
    const analyzeBtn = document.getElementById('analyzeBtn');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const diffSelect = document.getElementById('diffSelect');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const playBtn = document.getElementById('playBtn');
    const playText = document.getElementById('playText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownText = document.getElementById('countdownText');
    const guideAudioToggle = document.getElementById('guideAudioToggle');
    const guideAudioText = document.getElementById('guideAudioText');
    const songTitle = document.getElementById('songTitle');

    analyzeBtn.addEventListener('click', async () => {
      const url = ytUrlInput.value.trim();
      if (!url) {
        alert('유튜브 영상 주소를 입력해주세요!');
        return;
      }

      loadingOverlay.classList.remove('hidden');
      try {
        const res = await fetch(`${BACKEND_URL}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, difficulty: diffSelect.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '분석 실패');

        currentChart = data.notes;
        songTitle.innerText = data.title;
        bgmAudio.src = `${BACKEND_URL}${data.audioUrl}`;
        playBtn.disabled = false;
        alert(`분석 완료! 총 ${currentChart.length}개의 핸드벨 노트가 생성되었습니다.`);
      } catch (err) {
        alert(`오류: ${err.message}`);
      } finally {
        loadingOverlay.classList.add('hidden');
      }
    });

    function startPlayback() {
      bellSynth.init();
      countdownOverlay.classList.remove('hidden');
      let count = 3;
      countdownText.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownText.innerText = count;
        } else if (count === 0) {
          countdownText.innerText = "시작!";
        } else {
          clearInterval(timer);
          countdownOverlay.classList.add('hidden');
          isPlaying = true;
          songTime = 0;
          playedNotes.clear();
          if (bgmAudio.src) {
            bgmAudio.currentTime = 0;
            bgmAudio.play();
          }
          playText.innerText = "일시정지";
          playIcon.innerText = "❚❚";
        }
      }, 700);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        if (bgmAudio.src) bgmAudio.pause();
        playText.innerText = "이어하기";
        playIcon.innerText = "▶";
      } else {
        if (songTime === 0) {
          startPlayback();
        } else {
          isPlaying = true;
          if (bgmAudio.src) bgmAudio.play();
          playText.innerText = "일시정지";
          playIcon.innerText = "❚❚";
        }
      }
    });

    resetBtn.addEventListener('click', () => {
      isPlaying = false;
      songTime = 0;
      playedNotes.clear();
      if (bgmAudio.src) {
        bgmAudio.pause();
        bgmAudio.currentTime = 0;
      }
      playText.innerText = "연주 시작";
      playIcon.innerText = "▶";
    });

    guideAudioToggle.addEventListener('click', () => {
      bellSynth.enabled = !bellSynth.enabled;
      guideAudioText.innerText = bellSynth.enabled ? "ON" : "OFF (반주만)";
      guideAudioText.className = bellSynth.enabled ? "text-amber-400 font-bold" : "text-slate-400";
    });
  </script>
</body>
</html>
